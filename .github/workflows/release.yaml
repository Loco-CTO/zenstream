name: Version and Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump
        required: true
        type: choice
        default: fix
        options:
          - fix
          - minor
          - major
      retry_version:
        description: Existing release version to retry without bumping
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: version-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Bump frontend version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          RETRY_VERSION: ${{ inputs.retry_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ -n "$RETRY_VERSION" ]; then
            retry_version="${RETRY_VERSION#v}"
            if [[ ! "$retry_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "retry_version must be a semantic version such as 1.5.7 or v1.5.7." >&2
              exit 1
            fi
            if [ "$retry_version" != "$version" ]; then
              echo "retry_version $retry_version does not match package.json version $version." >&2
              exit 1
            fi
            tag="v$retry_version"
            if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Release tag $tag does not exist on origin." >&2
              exit 1
            fi
            if ! gh release view "$tag" --json tagName >/dev/null 2>&1; then
              echo "GitHub release $tag does not exist." >&2
              exit 1
            fi
            echo "Retrying existing GitHub release $tag."
            echo "version=$retry_version" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "reuse_existing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS=. read -r major minor fix <<< "$version"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; fix=0 ;;
            minor) minor=$((minor + 1)); fix=0 ;;
            fix) fix=$((fix + 1)) ;;
            *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
          esac
          new_version="$major.$minor.$fix"
          tag="v$new_version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Release tag $tag already exists." >&2
            exit 1
          fi
          VERSION="$new_version" node -e "const fs=require('fs'); const p=require('./package.json'); p.version=process.env.VERSION; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\\n')"
          printf '{\n  "main": 0\n}\n' > .main-version.json
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "reuse_existing=false" >> "$GITHUB_OUTPUT"

      - name: Commit and push main
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REUSE_EXISTING: ${{ steps.version.outputs.reuse_existing }}
        run: |
          set -euo pipefail
          if [ "$REUSE_EXISTING" = 'true' ]; then
            echo "Reusing the existing release commit for v$VERSION; no version commit needed."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json .main-version.json
          git commit -m "chore: release v$VERSION"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Align stable with main
        run: |
          git fetch origin stable || true
          stable_sha=$(git rev-parse refs/remotes/origin/stable 2>/dev/null || printf '%040d' 0)
          git push origin "HEAD:stable" --force-with-lease="refs/heads/stable:$stable_sha"

      - name: Ensure GitHub release exists
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              core.info(`GitHub release ${tag} already exists (id ${release.data.id}); reusing it.`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: process.env.TARGET_SHA,
                generate_release_notes: true,
                name: tag,
              });
              core.info(`Created GitHub release ${tag}.`);
            }
