services:
  zenstream:
    image: ${ZENSTREAM_IMAGE:-ghcr.io/loco-cto/zenstream:latest}
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: missing
    ports:
      - "${ZENSTREAM_PORT:-9086}:9086"
    environment:
      NODE_ENV: production
      ZENSTREAM_ORCHESTRATOR_URL: ${ZENSTREAM_ORCHESTRATOR_URL:?Set ZENSTREAM_ORCHESTRATOR_URL}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
