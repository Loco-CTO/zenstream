name: Web CI

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact candidate commit to validate
        required: true
        type: string
      skip_coverage_upload:
        description: Skip the external coverage report for release validation
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Verify candidate checkout
        if: inputs.candidate_sha != ''
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Check out Orchestrator contract fixtures
        uses: actions/checkout@v7
        with:
          repository: Loco-CTO/zenstream-orchestrator
          ref: main
          path: _contracts/zenstream-orchestrator
          sparse-checkout: contracts/fixtures

      - name: Enable shared API fixture tests when fixtures are available
        shell: bash
        run: |
          fixture_root="${GITHUB_WORKSPACE}/_contracts/zenstream-orchestrator/contracts/fixtures"
          if [[ -f "${fixture_root}/http.json" && -f "${fixture_root}/syncplay.json" ]]; then
            echo "ZENSTREAM_API_FIXTURE_ROOT=${fixture_root}" >> "${GITHUB_ENV}"
          else
            echo "::notice::Orchestrator fixtures are not on main yet; shared API fixture tests will run after the Orchestrator contract PR is merged."
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run lint
        run: pnpm lint

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Install DeepSource CLI
        if: ${{ !inputs.skip_coverage_upload }}
        run: curl -fsSL https://cli.deepsource.com/install | BINDIR=./bin sh

      - name: Upload JavaScript coverage
        if: ${{ !inputs.skip_coverage_upload }}
        run: ./bin/deepsource report --analyzer test-coverage --key javascript --value-file coverage/lcov.info --use-oidc

      - name: Build web client
        run: pnpm build

      - name: Smoke production Docker Compose image
        env:
          NEXT_PUBLIC_ZSO_URL: http://127.0.0.1:9088
          ZENSTREAM_ORCHESTRATOR_URL: http://127.0.0.1:9088
          ZENSTREAM_PORT: "19086"
        run: bash ./scripts/smoke-docker.sh
